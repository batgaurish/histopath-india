<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HistoPath India — Oral Histology & Pathology Educational Game</title>
  <meta name="description" content="A serious educational game designed for Indian dental students based on Shafer's Textbook of Oral Pathology. Master oral mucosa, tooth development, salivary glands, periodontium, and TMJ through interactive puzzles and quizzes.">
  <meta name="theme-color" content="#0d0f17">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="app">
    <!-- Animated background grid/mesh -->
    <div class="bg-mesh"></div>

    <!-- Main Navigation Header -->
    <header class="app-header glass-header">
      <div class="header-container">
        <a href="#" class="brand">
          <span class="brand-icon">🔬</span>
          <div class="brand-text">
            <span class="brand-title text-gradient">HistoPath</span>
            <span class="brand-subtitle">India Edition</span>
          </div>
        </a>

        <nav class="nav-links">
          <a href="#" class="nav-link">Home</a>
          <a href="#play" class="nav-link">Topics</a>
          <a href="#leaderboard" class="nav-link">Leaderboard</a>
          <a href="#avatar" class="nav-link">Avatar</a>
          <a href="#about" class="nav-link">About</a>
        </nav>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <!-- Views are dynamically rendered here by App (js/app.js) -->
    </main>
  </div>

  <!-- JavaScript Modules (Loaded in dependency order) -->
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/audio.js"></script>
  <script src="js/utils/timer.js"></script>

  <script src="js/data/topics.js"></script>
  <script src="js/data/questions.js"></script>

  <script src="js/games/jigsaw.js"></script>
  <script src="js/games/differences.js"></script>
  <script src="js/games/matching.js"></script>
  <script src="js/games/crossword.js"></script>

  <script src="js/components/avatar.js"></script>
  <script src="js/components/guide.js"></script>
  <script src="js/components/leaderboard.js"></script>
  <script src="js/components/quiz.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
